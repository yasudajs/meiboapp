<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>一般ページ | MeiboApp</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">
  </head>
  <body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
      <div class="container-fluid">
        <a class="navbar-brand" href="#">MeiboApp</a>
        <div class="navbar-nav ms-auto">
          <span class="navbar-text text-white me-3">
            <i class="bi bi-person"></i> {{ user.username }} (一般)
          </span>
          <a class="btn btn-outline-light btn-sm" href="{{ url_for('logout') }}">ログアウト</a>
        </div>
      </div>
    </nav>
    
    <div class="container py-5">
      <div class="row justify-content-center">
        <div class="col-md-8">
          <div class="card shadow">
            <div class="card-body text-center py-5">
              <h1 class="display-4 mb-4">
                <span class="badge bg-primary">一般ユーザー</span>
              </h1>
              <h2 class="mb-4">一般ページです</h2>
              <p class="lead text-muted">ようこそ、{{ user.username }} さん</p>
              
              <hr class="my-4">
              
              <div class="row mt-5">
                <div class="col-md-6 mb-3">
                  <div class="card border-primary">
                    <div class="card-body">
                      <h5 class="card-title">マイ連絡先</h5>
                      <p class="card-text">自分の連絡先を管理</p>
                    </div>
                  </div>
                </div>
                <div class="col-md-6 mb-3">
                  <div class="card border-success">
                    <div class="card-body">
                      <h5 class="card-title">連絡先検索</h5>
                      <p class="card-text">連絡先を検索・閲覧</p>
                    </div>
                  </div>
                </div>
                <div class="col-md-6 mb-3">
                  <div class="card border-info">
                    <div class="card-body">
                      <h5 class="card-title">マイグループ</h5>
                      <p class="card-text">自分のグループを管理</p>
                    </div>
                  </div>
                </div>
                <div class="col-md-6 mb-3">
                  <div class="card border-warning">
                    <div class="card-body">
                      <h5 class="card-title">プロフィール</h5>
                      <p class="card-text">プロフィール設定</p>
                    </div>
                  </div>
                </div>
              </div>
              
              <div class="mt-4">
                <small class="text-muted">
                  {% if user.last_login %}
                    最終ログイン: {{ user.last_login.strftime('%Y-%m-%d %H:%M') }}
                  {% else %}
                    最終ログイン: 初回ログイン
                  {% endif %}
                </small>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
  </body>
</html>
