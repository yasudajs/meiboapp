<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>管理者ページ | MeiboApp</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">
  </head>
  <body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
      <div class="container-fluid">
        <a class="navbar-brand" href="#">MeiboApp</a>
        <div class="navbar-nav ms-auto">
          <span class="navbar-text text-white me-3">
            <i class="bi bi-shield-check"></i> {{ user.username }} (管理者)
          </span>
          <a class="btn btn-outline-light btn-sm" href="{{ url_for('logout') }}">ログアウト</a>
        </div>
      </div>
    </nav>
    
    <div class="container py-5">
      <div class="row justify-content-center">
        <div class="col-md-8">
          <div class="card shadow">
            <div class="card-body text-center py-5">
              <h1 class="display-4 mb-4">
                <span class="badge bg-danger">管理者</span>
              </h1>
              <h2 class="mb-4">管理者ページです</h2>
              <p class="lead text-muted">ようこそ、{{ user.username }} さん</p>
              
              <hr class="my-4">
              
              <div class="row mt-5">
                <div class="col-md-6 mb-3">
                  <div class="card bg-primary text-white">
                    <div class="card-body">
                      <h5 class="card-title">ユーザー管理</h5>
                      <p class="card-text">ユーザーの作成・編集・削除</p>
                    </div>
                  </div>
                </div>
                <div class="col-md-6 mb-3">
                  <div class="card bg-success text-white">
                    <div class="card-body">
                      <h5 class="card-title">連絡先管理</h5>
                      <p class="card-text">全ユーザーの連絡先を管理</p>
                    </div>
                  </div>
                </div>
                <div class="col-md-6 mb-3">
                  <div class="card bg-info text-white">
                    <div class="card-body">
                      <h5 class="card-title">グループ管理</h5>
                      <p class="card-text">グループの作成・編集・削除</p>
                    </div>
                  </div>
                </div>
                <div class="col-md-6 mb-3">
                  <div class="card bg-warning text-dark">
                    <div class="card-body">
                      <h5 class="card-title">システム設定</h5>
                      <p class="card-text">システム全体の設定</p>
                    </div>
                  </div>
                </div>
              </div>
              
              <div class="mt-4">
                <small class="text-muted">
                  {% if user.last_login %}
                    最終ログイン: {{ user.last_login.strftime('%Y-%m-%d %H:%M') }}
                  {% else %}
                    最終ログイン: 初回ログイン
                  {% endif %}
                </small>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
  </body>
</html>
